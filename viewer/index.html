<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>web-portfolio viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #2a2a2a;
    --border: #3a3a3a;
    --text: #e8e8e8;
    --muted: #9a9a9a;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 -apple-system, "Helvetica Neue", "Hiragino Sans", "Yu Gothic UI", sans-serif; overflow: hidden; }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: rgba(30,30,30,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; }
  .muted { color: var(--muted); font-weight: 400; }
  select, input[type=search], button.icon {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font: inherit;
  }
  select { min-width: 200px; cursor: pointer; }
  input[type=search] { width: 220px; }
  button.icon { cursor: pointer; }
  button.icon:hover { background: #333; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { padding: 6px 12px; background: transparent; border: 0; color: var(--text); cursor: pointer; font: inherit; }
  .seg button.active { background: var(--accent); color: white; }
  .seg button:not(.active):hover { background: #333; }
  .hint { color: var(--muted); margin-left: auto; font-size: 12px; }
  .stage {
    position: fixed; inset: 0; top: 50px; overflow: hidden; cursor: grab;
    background:
      linear-gradient(45deg, #232323 25%, transparent 25%) 0 0/24px 24px,
      linear-gradient(-45deg, #232323 25%, transparent 25%) 0 12px/24px 24px,
      linear-gradient(45deg, transparent 75%, #232323 75%) 12px -12px/24px 24px,
      linear-gradient(-45deg, transparent 75%, #232323 75%) 12px 0/24px 24px,
      var(--bg);
  }
  .stage.dragging { cursor: grabbing; }
  .board {
    position: absolute; top: 0; left: 0; transform-origin: 0 0;
    padding: 60px 60px 120px 60px;
  }
  .empty { padding: 80px; text-align: center; color: var(--muted); font-size: 16px; }
  .section { margin-bottom: 60px; }
  .section h2 { font-size: 28px; font-weight: 600; margin: 0 0 24px; color: #fff; letter-spacing: 0.02em; }
  .section h2 .count { color: var(--muted); font-weight: 400; font-size: 18px; margin-left: 8px; }
  .frames { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  .frame {
    background: var(--panel); border-radius: 4px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
    text-decoration: none; color: inherit;
  }
  .frame:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.55); }
  .frame.dim { opacity: 0.18; }
  .frame .label {
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 2px;
  }
  .frame .label .title { font-size: 12px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frame .label .url { font-size: 11px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frame .imgwrap { background: white; min-height: 80px; }
  .frame img { display: block; width: 100%; height: auto; }
  .frame.desktop { width: 720px; }
  .frame.mobile  { width: 240px; }
  .pair { display: flex; gap: 16px; align-items: flex-start; }
  .hud {
    position: fixed; right: 16px; bottom: 16px; z-index: 5;
    background: rgba(42,42,42,0.92); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 12px; font-size: 12px; color: var(--muted);
    display: flex; gap: 12px; align-items: center;
  }
  .hud b { color: var(--text); font-weight: 600; }
  kbd { background: #333; padding: 1px 5px; border-radius: 3px; border: 1px solid #444; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>web-portfolio</h1>
  <select id="siteSelect" aria-label="サイト選択"></select>
  <span class="muted" id="count">— loading…</span>
  <div class="seg" id="modeSeg">
    <button data-mode="both" class="active">Both</button>
    <button data-mode="desktop">Desktop</button>
    <button data-mode="mobile">Mobile</button>
  </div>
  <input type="search" id="search" placeholder="検索（タイトル / URL）…" />
  <button class="icon" id="fit">Fit (F)</button>
  <button class="icon" id="reset">100% (0)</button>
  <span class="hint">drag to pan · wheel to zoom · click frame to open</span>
</header>

<div class="stage" id="stage">
  <div class="board" id="board"></div>
</div>

<div class="hud">
  <span>zoom <b id="zoom">100%</b></span>
  <span><kbd>F</kbd> fit · <kbd>0</kbd> reset · <kbd>+</kbd>/<kbd>-</kbd> zoom</span>
</div>

<script src="app.js"></script>
</body>
</html>
