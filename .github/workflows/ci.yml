name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Smoke test - help
        run: bun cli.ts help

      - name: Smoke test - list outputs valid JSON
        run: |
          bun cli.ts list --json | bun -e "
            let data = '';
            process.stdin.on('data', c => data += c);
            process.stdin.on('end', () => {
              const parsed = JSON.parse(data);
              if (!Array.isArray(parsed)) { console.error('Expected array'); process.exit(1); }
              console.log('OK: list returned array of', parsed.length, 'sites');
            });
          "

      - name: Smoke test - exits non-zero on unknown command
        run: |
          if bun cli.ts nonexistent 2>/dev/null; then
            echo "Expected non-zero exit"; exit 1
          else
            echo "OK: rejected unknown command"
          fi
