name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # pack:smoke は npm の挙動を検証するので、release.yml と同じ node / npm で回す。
      # runner 既定の npm のままだと、リリースだけが npm の変更で落ちる
      # （v0.7.0 で実際に起きた: PR の CI は pass、release.yml だけ npm 12 で失敗）。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure recent npm
        run: npm install -g npm@^12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify dist/cli.js exists
        run: test -f dist/cli.js && head -1 dist/cli.js

      - name: Verify npm package
        run: bun run pack:smoke

      - name: Smoke test - help
        run: node dist/cli.js help

      - name: Smoke test - version
        run: |
          expected=$(node -p "require('./package.json').version")
          version=$(node dist/cli.js --version)
          if [ "$version" != "$expected" ]; then
            echo "Expected $expected, got $version"; exit 1
          fi
          echo "OK: version is $version"

      - name: Smoke test - list outputs valid JSON
        run: |
          node dist/cli.js list --json | node -e "
            let data = '';
            process.stdin.on('data', c => data += c);
            process.stdin.on('end', () => {
              const parsed = JSON.parse(data);
              if (!parsed.success) { console.error('Expected success: true'); process.exit(1); }
              if (!Array.isArray(parsed.sites)) { console.error('Expected sites array'); process.exit(1); }
              console.log('OK: list returned array of', parsed.sites.length, 'sites');
            });
          "

      - name: Smoke test - exits non-zero on unknown command
        run: |
          if node dist/cli.js nonexistent 2>/dev/null; then
            echo "Expected non-zero exit"; exit 1
          else
            echo "OK: rejected unknown command"
          fi
